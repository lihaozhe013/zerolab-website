name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy-pages:
        description: Build and upload the GitHub Pages artifact.
        type: boolean
        default: false

permissions:
  contents: read
  pages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Check TypeScript
        run: pnpm exec tsc -b

      - name: Configure GitHub Pages
        if: ${{ inputs.deploy-pages == true }}
        id: pages
        uses: actions/configure-pages@v6

      - name: Build website
        run: pnpm build
        env:
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base_path || '' }}/

      - name: Verify deployment layout
        shell: bash
        run: |
          test -f dist/index.html
          if [[ -d dist/public ]]; then
            echo "::error::The deployment artifact must not contain a dist/public directory."
            exit 1
          fi

      - name: Upload deployment artifact
        if: ${{ inputs.deploy-pages != true }}
        uses: actions/upload-artifact@v7
        with:
          name: zerolab-website-dist
          path: dist/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.deploy-pages == true }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
